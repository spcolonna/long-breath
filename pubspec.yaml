name: long_breath
description: "Long Breath — roguelike de cartas de kung fu (MVP de combate)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_soloud: ^4.1.7
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/l10n/content/
    - assets/art/enemies/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/art/stages/qianyunshan/
    # hero.png es la fuente de tool/recolor_hero.py; el juego usa las variantes.
    - assets/art/player/hero_novice.png
    - assets/art/player/hero_tiger.png
    - assets/art/player/hero_snake.png
    - assets/art/player/hero_crane.png
