name: long_breath
description: "Long Breath — roguelike de cartas de kung fu (MVP de combate)."
publish_to: 'none'
version: 0.1.0+6

environment:
  sdk: ^3.11.4

dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_soloud: ^4.1.7
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/l10n/content/
    - assets/art/enemies/
    - assets/art/npc/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/art/stages/qianyunshan/
    - assets/art/stages/xuankongsi/
    - assets/art/stages/wolongding/
    - assets/art/ui/
    - assets/art/vfx/
    - assets/art/icons/
    - assets/art/weapons/
    - assets/art/cards/
    # hero.webp es la fuente de tool/recolor_hero.py; el juego usa las variantes.
    - assets/art/player/hero_novice.webp
    - assets/art/player/hero_tiger.webp
    - assets/art/player/hero_snake.webp
    - assets/art/player/hero_crane.webp
  shaders:
    - shaders/paper.frag
  # Tipografías libres (OFL), recortadas a los caracteres del juego (docs/arte/fuentes.md).
  fonts:
    - family: Alegreya
      fonts:
        - asset: assets/fonts/Alegreya-400.ttf
        - asset: assets/fonts/Alegreya-Italic.ttf
          style: italic
        - asset: assets/fonts/Alegreya-600.ttf
          weight: 600
        - asset: assets/fonts/Alegreya-700.ttf
          weight: 700
        - asset: assets/fonts/Alegreya-800.ttf
          weight: 800
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-700.ttf
          weight: 700
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/MaShanZheng-subset.ttf
