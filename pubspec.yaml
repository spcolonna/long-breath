name: long_breath
description: "Long Breath — roguelike de cartas de kung fu (MVP de combate)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_soloud: ^4.1.7
  go_router: ^17.5.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/l10n/content/
    - assets/art/enemies/
    - assets/art/npc/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/art/stages/qianyunshan/
    - assets/art/stages/xuankongsi/
    - assets/art/stages/wolongding/
    - assets/art/ui/
    - assets/art/vfx/
    - assets/art/icons/
    # Marcos por tipo; las ilustraciones de cartas se suman cuando haya código.
    - assets/art/cards/frame_fist.webp
    - assets/art/cards/frame_palm.webp
    - assets/art/cards/frame_kick.webp
    - assets/art/cards/frame_defense.webp
    - assets/art/cards/frame_technique.webp
    # hero.webp es la fuente de tool/recolor_hero.py; el juego usa las variantes.
    - assets/art/player/hero_novice.webp
    - assets/art/player/hero_tiger.webp
    - assets/art/player/hero_snake.webp
    - assets/art/player/hero_crane.webp
